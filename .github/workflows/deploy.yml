name: Déployer le frontend

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

       - name: Installer Node.js
        uses: actions/setup-node@v4
         with:
          node-version: 24


      - name: Installer les dépendances
        working-directory: "l'extrémité avant"
        run: npm ci

      - name: Construire le projet
        working-directory: "l'extrémité avant"
        run: npm run construire

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "l'extrémité avant/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
